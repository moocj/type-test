<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>type-test</title>
    <style>
      body {
        margin: 0 auto;
        padding: 3rem 1rem;
        max-width: 46rem;
        font-family: ui-monospace, "Cascadia Mono", monospace;
        font-size: 1.35rem;
        line-height: 1.7;
        background: #f3f3f3;
        color: #333;
      }
      #words {
        min-height: 5.1em; /* 3 * line-height */
        user-select: none;
      }
      #words .word {
        display: inline-block;
      }

      #words .untyped {
        color: #999;
      }
      #words .correct {
        color: #256029;
      }
      #words .incorrect {
        color: #b3261e;
        text-decoration: underline;
      }
      #words .extra {
        color: #8a5a00;
        text-decoration: underline dotted;
      }
      #words .current {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 3px;
      }

      #status {
        font-size: 0.85rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="words">loading...</div>

    <p id="status"></p>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
