<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>type-test</title>
    <style>
      body {
        margin: 0 auto;
        padding: 3rem 1rem;
        max-width: 46rem;
        font-family: ui-monospace, "Cascadia Mono", monospace;
        font-size: 1.35rem;
        line-height: 1.7;
        background: #f3f3f3;
        color: #333;
      }
      #typed {
        width: 100%;
        box-sizing: border-box;
        margin-top: 1.5rem;
        padding: 0.5rem;
        font: inherit;
      }
      #status {
        font-size: 0.85rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="words">loading...</div>

    <input
      id="typed"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    />

    <p id="status"></p>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
